<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit alarm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFC46B}a:hover{color:#FFD796}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
.cloud{position:absolute;filter:blur(9px);background:radial-gradient(30% 42% at 26% 62%,currentColor 95%,transparent 100%),radial-gradient(26% 50% at 50% 44%,currentColor 95%,transparent 100%),radial-gradient(26% 38% at 74% 60%,currentColor 95%,transparent 100%),radial-gradient(46% 24% at 50% 76%,currentColor 95%,transparent 100%);animation:drift 70s ease-in-out infinite alternate}
.g{background:linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0.06));border:1px solid rgba(255,255,255,0.24);box-shadow:inset 0 1px 0 rgba(255,255,255,0.32),0 10px 30px rgba(4,10,24,0.28);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%)}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; color: #F5F8FF; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; background: #081326">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, #081326 0%, #12264A 50%, #2B4A78 100%)">
    <div class="cloud" style="color: #9DB3D6; opacity: 0.3; top: 120px; left: -60px; width: 320px; height: 104px; animation-duration: 60s"></div>
    <div class="cloud" style="color: #B4C7E4; opacity: 0.28; top: 470px; left: 140px; width: 340px; height: 110px; animation-duration: 84s; animation-direction: alternate-reverse"></div>
    <div class="cloud" style="color: #B4C7E4; opacity: 0.3; top: 700px; left: -40px; width: 300px; height: 96px; animation-duration: 72s"></div>
  </div>

  <div class="g" style="position: absolute; top: 10px; left: 0; right: 0; bottom: 0; border-radius: 38px 38px 0 0; background: linear-gradient(180deg, rgba(18,34,64,0.62), rgba(18,34,64,0.5)); border-bottom: none">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0">
      <a href="Main.dc.html" aria-label="Cancel" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F5F8FF; background: rgba(255,255,255,0.12); box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600">Edit Alarm</h1>
      <a href="Main.dc.html" aria-label="Save" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #10233A; background: #FFC46B; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); box-sizing: border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      </a>
    </div>

    <div role="group" aria-label="Time" style="position: relative; margin: 14px 24px 0; height: 176px; display: flex; justify-content: center; gap: 18px; align-items: center; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">
      <div style="position: absolute; left: 0; right: 0; top: 70px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.1)"></div>
      <div style="position: relative; width: 60px; display: flex; flex-direction: column; align-items: flex-end; line-height: 35px; font-size: 22px">
        <span style="opacity: 0.2; font-size: 18px">4</span><span style="opacity: 0.45">5</span><span style="font-size: 24px; font-weight: 500">6</span><span style="opacity: 0.45">7</span><span style="opacity: 0.2; font-size: 18px">8</span>
      </div>
      <div style="position: relative; width: 60px; display: flex; flex-direction: column; align-items: center; line-height: 35px; font-size: 22px">
        <span style="opacity: 0.2; font-size: 18px">28</span><span style="opacity: 0.45">29</span><span style="font-size: 24px; font-weight: 500">30</span><span style="opacity: 0.45">31</span><span style="opacity: 0.2; font-size: 18px">32</span>
      </div>
      <div style="position: relative; width: 60px; display: flex; flex-direction: column; align-items: flex-start; line-height: 35px; font-size: 22px">
        <span style="visibility: hidden">PM</span><span style="visibility: hidden">PM</span><span style="font-size: 24px; font-weight: 500">AM</span><span style="opacity: 0.45">PM</span><span style="visibility: hidden">PM</span>
      </div>
    </div>

    <div style="padding: 18px 20px 0">
      <div style="font-size: 15px; font-weight: 600; color: rgba(245,248,255,0.7); margin-bottom: 10px">Repeat</div>
      <div role="group" aria-label="Repeat days" style="display: flex; justify-content: space-between">
        <button aria-pressed="false" aria-label="Sunday" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; font-size: 16px; font-weight: 600; background: rgba(255,255,255,0.06); border: 1px solid rgba(245,248,255,0.24); color: rgba(245,248,255,0.7)">S</button>
        <button aria-pressed="true" aria-label="Monday" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; font-size: 16px; font-weight: 600; background: #FFC46B; border: none; color: #10233A">M</button>
        <button aria-pressed="true" aria-label="Tuesday" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; font-size: 16px; font-weight: 600; background: #FFC46B; border: none; color: #10233A">T</button>
        <button aria-pressed="true" aria-label="Wednesday" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; font-size: 16px; font-weight: 600; background: #FFC46B; border: none; color: #10233A">W</button>
        <button aria-pressed="true" aria-label="Thursday" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; font-size: 16px; font-weight: 600; background: #FFC46B; border: none; color: #10233A">T</button>
        <button aria-pressed="true" aria-label="Friday" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; font-size: 16px; font-weight: 600; background: #FFC46B; border: none; color: #10233A">F</button>
        <button aria-pressed="false" aria-label="Saturday" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; font-size: 16px; font-weight: 600; background: rgba(255,255,255,0.06); border: 1px solid rgba(245,248,255,0.24); color: rgba(245,248,255,0.7)">S</button>
      </div>
    </div>

    <div style="margin: 22px 16px 0; border-radius: 24px; background: rgba(255,255,255,0.08)">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; font-size: 17px">
        <label for="alarm-label">Label</label>
        <input id="alarm-label" value="Wake up" style="width: 180px; text-align: right; background: transparent; border: none; outline: none; color: rgba(245,248,255,0.7); font: inherit">
      </div>
    </div>

    <div style="font-size: 15px; font-weight: 600; color: rgba(245,248,255,0.7); margin: 20px 20px 8px">Gentle wake</div>
    <div style="margin: 0 16px; border-radius: 24px; background: rgba(255,255,255,0.08)">
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px; border-bottom: 0.5px solid rgba(245,248,255,0.14)">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC46B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6a8.5 8.5 0 0 1 0 12"></path></svg>
          <div>
            <div style="font-size: 17px">Gradual volume</div>
            <div style="font-size: 13px; color: rgba(245,248,255,0.7); margin-top: 2px">Rises over 60 seconds</div>
          </div>
        </div>
        <button role="switch" aria-checked="true" aria-label="Gradual volume" style="position: relative; width: 51px; height: 31px; border-radius: 16px; border: none; padding: 0; background: #FFC46B; flex-shrink: 0"><span style="position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span></button>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC46B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="7.5" y="3" width="9" height="18" rx="2"></rect><path d="M3.5 9v6M20.5 9v6"></path></svg>
          <div style="font-size: 17px">Vibration</div>
        </div>
        <button role="switch" aria-checked="true" aria-label="Vibration" style="position: relative; width: 51px; height: 31px; border-radius: 16px; border: none; padding: 0; background: #FFC46B; flex-shrink: 0"><span style="position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span></button>
      </div>
    </div>

    <div style="font-size: 15px; font-weight: 600; color: rgba(245,248,255,0.7); margin: 20px 20px 8px">Turn off by</div>
    <a href="StopMethod.dc.html" style="margin: 0 16px; border-radius: 24px; background: rgba(255,255,255,0.08); display: flex; align-items: center; gap: 14px; padding: 12px 16px; text-decoration: none; color: #F5F8FF">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,196,107,0.18); display: flex; align-items: center; justify-content: center; color: #FFC46B">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 8.5a5 5 0 0 1 0 7M12 5.5a9.5 9.5 0 0 1 0 13M4 11v2"></path></svg>
      </span>
      <span style="flex: 1">
        <span style="display: block; font-size: 17px">Bathroom mirror</span>
        <span style="display: block; font-size: 13px; color: rgba(245,248,255,0.7); margin-top: 2px">NFC tag</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(245,248,255,0.5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
