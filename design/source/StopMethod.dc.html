<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stop method</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFC46B}a:hover{color:#FFD796}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
.cloud{position:absolute;filter:blur(9px);background:radial-gradient(30% 42% at 26% 62%,currentColor 95%,transparent 100%),radial-gradient(26% 50% at 50% 44%,currentColor 95%,transparent 100%),radial-gradient(26% 38% at 74% 60%,currentColor 95%,transparent 100%),radial-gradient(46% 24% at 50% 76%,currentColor 95%,transparent 100%);animation:drift 70s ease-in-out infinite alternate}
.g{background:linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0.06));border:1px solid rgba(255,255,255,0.24);box-shadow:inset 0 1px 0 rgba(255,255,255,0.32),0 10px 30px rgba(4,10,24,0.28);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%)}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; color: #F5F8FF; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; background: #081326">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, #081326 0%, #12264A 50%, #2B4A78 100%)">
    <div class="cloud" style="color: #9DB3D6; opacity: 0.3; top: 180px; left: 120px; width: 320px; height: 104px; animation-duration: 66s"></div>
    <div class="cloud" style="color: #B4C7E4; opacity: 0.28; top: 520px; left: -80px; width: 340px; height: 110px; animation-duration: 90s; animation-direction: alternate-reverse"></div>
    <div class="cloud" style="color: #B4C7E4; opacity: 0.3; top: 740px; left: 120px; width: 300px; height: 96px; animation-duration: 74s"></div>
  </div>

  <div class="g" style="position: absolute; top: 10px; left: 0; right: 0; bottom: 0; border-radius: 38px 38px 0 0; background: linear-gradient(180deg, rgba(18,34,64,0.62), rgba(18,34,64,0.5)); border-bottom: none">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0">
      <a href="Edit.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F5F8FF; background: rgba(255,255,255,0.12); box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600">Stop Method</h1>
      <span style="width: 44px"></span>
    </div>

    <p style="margin: 22px 20px 0; font-size: 17px; line-height: 1.4; color: rgba(245,248,255,0.78)">Pick something you have to get out of bed to reach. The alarm only stops when you scan or tap it.</p>

    <div role="radiogroup" aria-label="Stop method" style="margin: 22px 16px 0; border-radius: 24px; background: rgba(255,255,255,0.08)">
      <button role="radio" aria-checked="false" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: transparent; border: none; border-bottom: 0.5px solid rgba(245,248,255,0.14); text-align: left">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1"></rect><rect x="14" y="3.5" width="6.5" height="6.5" rx="1"></rect><rect x="3.5" y="14" width="6.5" height="6.5" rx="1"></rect><path d="M14 14h3v3h-3zM20.5 20.5h-3"></path></svg>
        </span>
        <span style="flex: 1"><span style="display: block; font-size: 17px">QR code</span><span style="display: block; font-size: 13px; color: rgba(245,248,255,0.7); margin-top: 2px">Print one, or use any QR you own</span></span>
      </button>
      <button role="radio" aria-checked="false" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: transparent; border: none; border-bottom: 0.5px solid rgba(245,248,255,0.14); text-align: left">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6v12M7.5 6v12M11 6v12M14 6v12M17.5 6v12M20 6v12"></path></svg>
        </span>
        <span style="flex: 1"><span style="display: block; font-size: 17px">Any barcode</span><span style="display: block; font-size: 13px; color: rgba(245,248,255,0.7); margin-top: 2px">Toothpaste, cereal box, coffee bag</span></span>
      </button>
      <button role="radio" aria-checked="true" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: transparent; border: none; text-align: left">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,196,107,0.18); color: #FFC46B; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 8.5a5 5 0 0 1 0 7M12 5.5a9.5 9.5 0 0 1 0 13M4 11v2"></path></svg>
        </span>
        <span style="flex: 1"><span style="display: block; font-size: 17px">NFC tag</span><span style="display: block; font-size: 13px; color: rgba(245,248,255,0.7); margin-top: 2px">A sticker you tap, e.g. on the mirror</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC46B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      </button>
    </div>

    <div style="font-size: 15px; font-weight: 600; color: rgba(245,248,255,0.7); margin: 24px 20px 8px">Your tag</div>
    <div style="margin: 0 16px; border-radius: 24px; background: rgba(255,255,255,0.08)">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; font-size: 17px; border-bottom: 0.5px solid rgba(245,248,255,0.14)">
        <label for="tag-name">Name</label>
        <input id="tag-name" value="Bathroom mirror" style="width: 190px; text-align: right; background: transparent; border: none; outline: none; color: rgba(245,248,255,0.7); font: inherit">
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; font-size: 17px">
        <span>Status</span>
        <span style="display: flex; align-items: center; gap: 6px; color: #4CD97B">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          Registered
        </span>
      </div>
    </div>
    <button style="display: block; margin: 12px 20px 0; padding: 8px 0; background: transparent; border: none; color: #FFC46B; font-size: 17px">Register a different tag</button>

    <div style="position: absolute; left: 16px; right: 16px; bottom: 34px">
      <a href="NFC.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; font-size: 17px; font-weight: 600; text-decoration: none; color: #10233A; background: #FFC46B; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 10px 28px rgba(255,196,107,0.22)">Test tag</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
